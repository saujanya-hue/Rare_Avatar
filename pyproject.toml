[project]
name = "rare-avatar"
version = "1.0.0"
description = "Rare-Disease Synthetic Patient Avatars Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.9",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
